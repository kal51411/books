[project]
name = "nyayagpt"
version = "0.1.0"
description = "AI-Powered Indian Legal Research and Assistance Platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "redis>=5.0.0",
  "qdrant-client>=1.10.0",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "anthropic>=0.34.0",
  "google-generativeai>=0.7.0",
  "langgraph>=0.2.0",
  "opentelemetry-api>=1.26.0",
  "prometheus-client>=0.20.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "slowapi>=0.1.9",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0", "mypy>=1.11.0", "coverage>=7.6.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "evaluation/tests", "ingestion/tests", "tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["E501", "S101", "S105"]
