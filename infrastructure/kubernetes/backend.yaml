apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyayagpt-backend
spec:
  replicas: 3
  selector:
    matchLabels: { app: nyayagpt-backend }
  template:
    metadata:
      labels: { app: nyayagpt-backend }
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/nyayagpt-backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: nyayagpt-secrets } }]
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
---
apiVersion: v1
kind: Service
metadata:
  name: nyayagpt-backend
spec:
  selector: { app: nyayagpt-backend }
  ports: [{ port: 8000, targetPort: 8000 }]
